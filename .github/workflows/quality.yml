name: Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Typecheck, principle check, and build
        run: npm run check
      - name: Validate harness
        run: bash scripts/validate-harness.sh .
      - name: Run quick sweep
        run: bash tools/sweep.sh --quick
